# board-add.yml — put every new issue and PR in this repo on the XCOS Ops board.
#
# WHY THIS IS A FILE AND NOT A SETTING. GitHub Projects has an "Auto-add to project"
# workflow that does the same job from the Projects UI — and it takes exactly ONE
# repository (verified 2026-09-17: the picker is a single-select listbox, and there is no
# way to add a second auto-add workflow). So the UI could never cover this estate, and the
# rule lived somewhere `scripts/board.sh` cannot read or assert, which P1 calls a defect.
#
# THE CREDENTIAL, AND WHAT IT COST. `XAL_PROJECT_TOKEN` is a CLASSIC PAT with `project`
# AND `repo`. Three narrower options were tried and each is ruled out by evidence, not by
# assumption — keep this list, because every one of them looks like it should work:
#
#   * GITHUB_TOKEN — no Projects permission exists for it on a user-owned project.
#   * A fine-grained PAT — searching `project` in its account-permission picker returns
#     "No items available". Fine-grained tokens cannot reach user-owned projects at all.
#   * A classic PAT with `project` but NOT `repo` — fails. Both actions/add-to-project AND
#     a direct addProjectV2ItemById with the node id taken straight from the event payload
#     return `NOT_FOUND: Could not resolve to a node with the global id of 'PR_...'`. That
#     second test is the informative one: it proves the MUTATION needs repo read, not the
#     action's own lookup, so no amount of avoiding the lookup helps.
#
# `repo` is full control of every private repo on the account, which is a real cost and is
# accepted deliberately rather than by drift. It expires 2026-12-16, declared in
# .xal/gate-inputs and enforced by gate 0. The narrow long-term answer is a GitHub App of
# our own (platform ADR-0008 defers one); this is the interim.
#
# The mutation is called directly rather than through actions/add-to-project: one less
# third-party dependency, and the failure surfaces as a plain API error.
name: Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# One add at a time per item; a re-run must not race. Adding an item that is already on
# the board is a no-op that returns the existing item, so this is safe to repeat.
concurrency:
  group: board-add-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-to-board:
    runs-on: ubuntu-latest
    steps:
      # ADDING IS NOT ENOUGH — the item must arrive with its fields honest.
      #
      # An auto-added item lands with an empty Department and no Primary artifact, which
      # board-hygiene.sh fails. That is not a theory: on 2026-09-14 the gate's first run
      # found 18 violations across 9 items, EVERY one of them auto-added, and the five
      # items this very workflow added on the day it shipped repeated it exactly. Adding
      # the item and leaving it empty trades a coverage defect for a hygiene defect.
      #
      # So both fields are set here, at add time, from what the event already knows:
      #   * Primary artifact = the issue/PR URL. For a code change that IS the evidence,
      #     so there is no case where a session could do better.
      #   * Department = engineering, as a DEFAULT and not a claim. Every repo carrying
      #     this workflow is a code repo, so it is right far more often than empty is —
      #     and a session that knows better corrects it at wrap. An empty field fails the
      #     gate; a sensible default that is occasionally wrong does not, and is visible.
      #
      # The ids below are the live board's, defined by scripts/board.sh in xal-company.
      # If a field is ever deleted and recreated its id changes and this step fails loudly
      # rather than silently skipping — which is the behaviour to keep.
      - name: Add the item to XCOS Ops
        env:
          GH_TOKEN: ${{ secrets.XAL_PROJECT_TOKEN }}
          CONTENT_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
          CONTENT_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          PROJECT_ID="PVT_kwHOA7GFks4BgH2f"
          DEPARTMENT_FIELD="PVTSSF_lAHOA7GFks4BgH2fzhabnMI"
          DEPARTMENT_ENGINEERING="21c2b94c"
          ARTIFACT_FIELD="PVTF_lAHOA7GFks4BgH2fzhabmUo"

          # Adding an item already on the board returns the existing item, so this is
          # idempotent and safe to re-run.
          ITEM_ID="$(gh api graphql \
            -f query='mutation($project:ID!, $content:ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f content="$CONTENT_ID" \
            --jq '.data.addProjectV2ItemById.item.id')"

          echo "item: $ITEM_ID"

          gh api graphql \
            -f query='mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$DEPARTMENT_FIELD" -f option="$DEPARTMENT_ENGINEERING" > /dev/null
          echo "Department: engineering (default — correct it at wrap if this is not engineering work)"

          gh api graphql \
            -f query='mutation($project:ID!, $item:ID!, $field:ID!, $text:String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { text: $text }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$ARTIFACT_FIELD" -f text="$CONTENT_URL" > /dev/null
          echo "Primary artifact: $CONTENT_URL"
